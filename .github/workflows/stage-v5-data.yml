name: Stage V5 public data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stage_v5_data.py'
      - '.github/workflows/stage-v5-data.yml'
      - 'TRIGGER_V5_DATA'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - run: python scripts/stage_v5_data.py
      - name: Commit staged data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staged raw/*.csv || true
          git add staged
          git commit -m 'Stage timestamped price, ECB FX, and GTFS demand data' || exit 0
          git push
