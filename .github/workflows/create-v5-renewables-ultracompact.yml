name: Create V5 renewable chronology ultracompact bundle

on:
  push:
    paths:
      - '.github/workflows/create-v5-renewables-ultracompact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - name: Build renewable bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, base64
          import numpy as np
          import pandas as pd
          root=Path('.')
          out=root/'bundle_renewables_ultracompact'; out.mkdir(exist_ok=True)
          energy=pd.concat([pd.read_csv(root/f'staged/spain_energy_2017_{m:02d}.csv') for m in range(1,13)],ignore_index=True)
          energy['timestamp_utc']=pd.to_datetime(energy['timestamp_utc'],utc=True)
          energy=energy.sort_values('timestamp_utc').drop_duplicates('timestamp_utc')
          assert len(energy)==8760
          wind=np.rint(energy['wind_onshore_mw'].to_numpy(float)).astype(np.uint16)
          solar=np.rint(energy['solar_mw'].to_numpy(float)).astype(np.uint16)
          load=np.rint(energy['system_load_mw'].to_numpy(float)).astype(np.uint16)
          np.savez_compressed(out/'v5_renewables.npz',wind_onshore_mw=wind,solar_mw=solar,system_load_mw=load)
          raw=(out/'v5_renewables.npz').read_bytes(); b64=base64.b64encode(raw).decode('ascii')
          (out/'v5_renewables.b64').write_text('\n'.join(b64[i:i+76] for i in range(0,len(b64),76))+'\n')
          meta={'npz_size_bytes':len(raw),'npz_sha256':hashlib.sha256(raw).hexdigest(),'base64_lines':(len(b64)+75)//76,'rows':8760,'start_utc':'2017-01-01T00:00:00Z','quantization_mw':1.0}
          (out/'manifest.json').write_text(json.dumps(meta,indent=2)); print(json.dumps(meta,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundle_renewables_ultracompact/
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add V5 renewable chronology ultracompact bundle'; git push; fi
