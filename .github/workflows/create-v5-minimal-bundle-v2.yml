name: Create V5 minimal data bundle v2

on:
  push:
    paths:
      - '.github/workflows/create-v5-minimal-bundle-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal analysis bundle without external Python packages
        run: |
          set -euo pipefail
          rm -rf bundle_minimal_v2 minimal_v5
          mkdir -p bundle_minimal_v2 minimal_v5
          first=1
          for f in staged/spain_energy_2017_*.csv; do
            if [ "$first" -eq 1 ]; then
              cut -d, -f1-6 "$f" > minimal_v5/spain_energy_price_2017.csv
              first=0
            else
              tail -n +2 "$f" | cut -d, -f1-6 >> minimal_v5/spain_energy_price_2017.csv
            fi
          done
          cp staged/ecb_usd_per_eur_2017.csv minimal_v5/
          cp staged/mbta_schedule_derived_hydrogen_demand.csv minimal_v5/
          cp staged/trimet_schedule_derived_hydrogen_demand.csv minimal_v5/
          cp staged/cta_schedule_derived_hydrogen_demand.csv minimal_v5/
          cp staged/manifest.json minimal_v5/
          tar -czf bundle_minimal_v2/v5_minimal_data.tar.gz minimal_v5
          base64 -w 6000 bundle_minimal_v2/v5_minimal_data.tar.gz > bundle_minimal_v2/v5_minimal_data_wrapped.b64
          wc -l bundle_minimal_v2/v5_minimal_data_wrapped.b64 > bundle_minimal_v2/v5_minimal_data_wrapped.lines.txt
          sha256sum bundle_minimal_v2/v5_minimal_data.tar.gz > bundle_minimal_v2/v5_minimal_data.tar.gz.sha256
          sha256sum bundle_minimal_v2/v5_minimal_data_wrapped.b64 > bundle_minimal_v2/v5_minimal_data_wrapped.b64.sha256
          ls -lh bundle_minimal_v2/*
      - name: Commit minimal bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundle_minimal_v2
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add V5 minimal staged data bundle v2'
            git push
          fi
