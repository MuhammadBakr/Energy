name: Create V5 base64 transport file

on:
  push:
    paths:
      - '.github/workflows/create-v5-base64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create single-line base64 transport file
        run: |
          set -euo pipefail
          base64 -w 0 bundle/v5_staged_data.tar.gz > bundle/v5_staged_data.b64
          sha256sum bundle/v5_staged_data.b64 > bundle/v5_staged_data.b64.sha256
      - name: Commit generated transport file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundle/v5_staged_data.b64 bundle/v5_staged_data.b64.sha256
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add V5 staged data base64 transport file'
            git push
          fi
