name: Create V5 wrapped base64 transport

on:
  push:
    paths:
      - '.github/workflows/create-v5-wrapped-base64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create wrapped base64 file
        run: |
          set -euo pipefail
          base64 bundle/v5_staged_data.tar.gz > bundle/v5_staged_data_wrapped.b64
          wc -l bundle/v5_staged_data_wrapped.b64 > bundle/v5_staged_data_wrapped.lines.txt
          sha256sum bundle/v5_staged_data_wrapped.b64 > bundle/v5_staged_data_wrapped.b64.sha256
      - name: Commit generated file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundle/v5_staged_data_wrapped.b64 bundle/v5_staged_data_wrapped.lines.txt bundle/v5_staged_data_wrapped.b64.sha256
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add wrapped V5 staged data base64 transport'
            git push
          fi
