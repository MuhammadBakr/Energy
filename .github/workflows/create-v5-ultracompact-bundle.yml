name: Create V5 ultracompact numeric bundle

on:
  push:
    paths:
      - '.github/workflows/create-v5-ultracompact-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - name: Build bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, base64
          import numpy as np
          import pandas as pd
          root=Path('.')
          out=root/'bundle_ultracompact'; out.mkdir(exist_ok=True)
          energy=pd.concat([pd.read_csv(root/f'staged/spain_energy_2017_{m:02d}.csv') for m in range(1,13)],ignore_index=True)
          energy['timestamp_utc']=pd.to_datetime(energy['timestamp_utc'],utc=True)
          energy=energy.sort_values('timestamp_utc').drop_duplicates('timestamp_utc')
          assert len(energy)==8760
          # Exact hourly chronology is implicit from 2017-01-01T00:00:00Z.
          price_cents=np.rint(energy['price_day_ahead_eur_per_mwh'].to_numpy(float)*100).astype(np.int16)
          ecb=pd.read_csv(root/'staged/ecb_usd_per_eur_2017.csv')
          full_dates=pd.date_range('2017-01-01','2017-12-31',freq='D')
          fx=pd.Series(ecb['usd_per_eur'].to_numpy(float),index=pd.to_datetime(ecb['date'])).reindex(full_dates).ffill().bfill()
          fx_micro=np.rint(fx.to_numpy()*1_000_000).astype(np.int32)
          arrays={
            'price_day_ahead_cents_per_mwh':price_cents,
            'ecb_usd_per_eur_micro':fx_micro,
          }
          site_meta={}
          for site in ('mbta','trimet','cta'):
              df=pd.read_csv(root/f'staged/{site}_schedule_derived_hydrogen_demand.csv')
              demand=df[['demand_LD_kg','demand_MD_kg','demand_HD_kg']].to_numpy(float)
              if demand.max()*10>np.iinfo(np.uint16).max:
                  raise SystemExit(f'{site} demand too large for deci-kg uint16: {demand.max()}')
              arrays[f'{site}_demand_deci_kg']=np.rint(demand*10).astype(np.uint16)
              site_meta[site]={
                 'start_local':str(df['timestamp_local'].iloc[0]),
                 'rows':int(len(df)),
                 'quantization_kg':0.1,
              }
          np.savez_compressed(out/'v5_ultracompact.npz',**arrays)
          raw=(out/'v5_ultracompact.npz').read_bytes()
          b64=base64.b64encode(raw).decode('ascii')
          (out/'v5_ultracompact.b64').write_text('\n'.join(b64[i:i+76] for i in range(0,len(b64),76))+'\n')
          meta={
            'npz_size_bytes':len(raw),
            'npz_sha256':hashlib.sha256(raw).hexdigest(),
            'base64_lines':(len(b64)+75)//76,
            'energy_start_utc':'2017-01-01T00:00:00Z',
            'energy_rows':8760,
            'price_scale_eur_per_mwh':0.01,
            'fx_start_date':'2017-01-01',
            'fx_rows':365,
            'fx_scale_usd_per_eur':1e-6,
            'sites':site_meta,
            'source_manifest':'staged/manifest.json',
          }
          (out/'manifest.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps(meta,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundle_ultracompact/
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add V5 ultracompact numeric bundle'; git push; fi
