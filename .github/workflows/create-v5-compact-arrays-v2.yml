name: Create compact V5 numeric bundle v2

on:
  push:
    paths:
      - '.github/workflows/create-v5-compact-arrays-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Build compact arrays
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, base64
          import numpy as np
          import pandas as pd

          root=Path('.')
          out=root/'bundle_compact_v2'
          out.mkdir(exist_ok=True)
          energy=pd.concat([pd.read_csv(root/f'staged/spain_energy_2017_{m:02d}.csv') for m in range(1,13)], ignore_index=True)
          energy['timestamp_utc']=pd.to_datetime(energy['timestamp_utc'], utc=True)
          energy=energy.sort_values('timestamp_utc').drop_duplicates('timestamp_utc')
          if len(energy)!=8760:
              raise SystemExit(f'expected 8760 energy rows, got {len(energy)}')
          ecb=pd.read_csv(root/'staged/ecb_usd_per_eur_2017.csv')
          ecb['date']=pd.to_datetime(ecb['date']).dt.strftime('%Y-%m-%d')
          sites={}
          for site in ('mbta','trimet','cta'):
              df=pd.read_csv(root/f'staged/{site}_schedule_derived_hydrogen_demand.csv')
              sites[site]={
                  'timestamp_local':df['timestamp_local'].astype(str).to_numpy(dtype='U19'),
                  'demand':df[['demand_LD_kg','demand_MD_kg','demand_HD_kg']].to_numpy(dtype=np.float32),
              }
          np.savez_compressed(
              out/'v5_compact_arrays.npz',
              energy_timestamp_utc=energy['timestamp_utc'].dt.strftime('%Y-%m-%dT%H:%M:%SZ').to_numpy(dtype='U20'),
              price_day_ahead_eur_mwh=energy['price_day_ahead_eur_per_mwh'].to_numpy(dtype=np.float32),
              price_actual_eur_mwh=energy['price_actual_eur_per_mwh'].to_numpy(dtype=np.float32),
              wind_onshore_mw=energy['wind_onshore_mw'].to_numpy(dtype=np.float32),
              solar_mw=energy['solar_mw'].to_numpy(dtype=np.float32),
              system_load_mw=energy['system_load_mw'].to_numpy(dtype=np.float32),
              ecb_date=ecb['date'].to_numpy(dtype='U10'),
              ecb_usd_per_eur=ecb['usd_per_eur'].to_numpy(dtype=np.float32),
              mbta_timestamp_local=sites['mbta']['timestamp_local'], mbta_demand=sites['mbta']['demand'],
              trimet_timestamp_local=sites['trimet']['timestamp_local'], trimet_demand=sites['trimet']['demand'],
              cta_timestamp_local=sites['cta']['timestamp_local'], cta_demand=sites['cta']['demand'],
          )
          p=out/'v5_compact_arrays.npz'
          raw=p.read_bytes()
          b64=base64.b64encode(raw).decode('ascii')
          (out/'v5_compact_arrays.b64').write_text('\n'.join(b64[i:i+76] for i in range(0,len(b64),76))+'\n')
          meta={
              'npz_size_bytes':len(raw),
              'npz_sha256':hashlib.sha256(raw).hexdigest(),
              'base64_lines':(len(b64)+75)//76,
              'energy_rows':len(energy),
              'site_rows':{k:int(v['demand'].shape[0]) for k,v in sites.items()},
              'source_manifest':'staged/manifest.json',
          }
          (out/'manifest.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps(meta,indent=2))
          PY
      - name: Commit compact bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundle_compact_v2/
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add compact V5 numeric data bundle v2'; git push; fi
